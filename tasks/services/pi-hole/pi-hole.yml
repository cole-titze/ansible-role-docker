---
- name: Check if Pi-hole is installed
  ansible.builtin.command: which pihole
  register: pihole_installed
  changed_when: false
  failed_when: false

- name: Install Pi-hole
  block:
    - name: Download Pi-hole installer
      ansible.builtin.get_url:
        url: https://install.pi-hole.net
        dest: /tmp/pihole-install.sh
        mode: '0755'

    - name: Create Pi-hole config directory
      ansible.builtin.file:
        path: /etc/pihole
        state: directory
        mode: '0755'

    - name: Create Pi-hole unattended config
      ansible.builtin.copy:
        dest: /etc/pihole/setupVars.conf
        mode: '0644'
        content: |
          PIHOLE_INTERFACE=eth0
          PIHOLE_DNS_1=127.0.0.1#5335
          QUERY_LOGGING=true
          INSTALL_WEB_SERVER=true
          INSTALL_WEB_INTERFACE=true
          LIGHTTPD_ENABLED=true
          CACHE_SIZE=10000
          DNS_FQDN_REQUIRED=true
          DNS_BOGUS_PRIV=true
          DNSMASQ_LISTENING=local
          BLOCKING_ENABLED=true

    - name: Install Pi-hole unattended
      ansible.builtin.command: bash /tmp/pihole-install.sh --unattended
      become: true

    - name: Clean up installer
      ansible.builtin.file:
        path: /tmp/pihole-install.sh
        state: absent
  when: pihole_installed.rc != 0

- name: Update Pi-hole if already installed
  ansible.builtin.command: pihole -up
  become: true
  when: pihole_installed.rc == 0

- name: Read Pi-hole dnsmasq_lines
  ansible.builtin.command: pihole-FTL --config misc.dnsmasq_lines
  become: true
  register: pihole_current_dnsmasq_lines
  changed_when: false
  check_mode: false

- name: Set Pi-hole dnsmasq_lines
  ansible.builtin.command: "pihole-FTL --config misc.dnsmasq_lines '{{ pihole_dnsmasq_lines | to_json }}'"
  become: true
  # pihole-FTL prints the list as "[ a, b ]", not JSON.
  when: pihole_current_dnsmasq_lines.stdout != '[ ' ~ (pihole_dnsmasq_lines | join(', ')) ~ ' ]'

- name: Read Pi-hole regex denylist
  ansible.builtin.command: pihole-FTL sqlite3 /etc/pihole/gravity.db "select domain from domainlist where type = 3"
  become: true
  register: pihole_current_regex_denylist
  changed_when: false
  check_mode: false

- name: Add Pi-hole regex denylist entries
  ansible.builtin.command: pihole --regex --comment "Managed by Ansible" '{{ item }}'
  become: true
  loop: "{{ pihole_regex_denylist }}"
  when: item not in pihole_current_regex_denylist.stdout_lines
